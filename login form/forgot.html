<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #111827, #1e293b, #7c2d12);
            ;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .basim {
            width: 400px;
            height: 400px;
            padding: 20px;
            border-radius: 25px;
            padding: 20px;

            background: rgba(255, 255, 255, 0.10);

            /* Border */
            border: 1px solid rgba(251, 146, 60, 0.35);

            /* Glass effect */
            backdrop-filter: blur(15px);

            /* Neon shadow */
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.25);

            color: #e2e8f0;
        }

        h2 {
            color: #fb923c;
            text-shadow: 0 0 12px rgba(251, 146, 60, 0.6);
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bolder;
            color: #fed7aa;
            margin-top: 10px;
        }

        input {
            width: 100%;
            margin-bottom: 10px;
            font-size: 20px;
            padding: 11px;
            border-radius: 10px;
        }

        button {
            width: 100%;

            background: #f97316;
            color: #111827;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
        }

        button:hover {
            background: #fb923c;
            box-shadow: 0 0 25px rgba(251, 146, 60, 0.9);
        }

        a {
            color: #fed7aa;
            align-items: center;
            font-size: 20px;
        }
    </style>

</head>

<body>

    <div class="basim">
        <h2>Forgot your password ?</h2>
        <form action="">
            <div class="basim"> <label for="find your account"> FIND YOUR ACCOUNT :- </label>
                <input type="email" placeholder="number or email">
                <br><br>
                <button>SUBMIT</button>
                <BR><BR>
                <a href="index.html">back to login page ?</a>
        </form>
    </div>


</body>

</html>
