```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
<link rel="stylesheet" href="/styles/signup.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .form-box {
            max-width: 675px;
            background-color: white;
            margin: 40px auto;
            padding: 40px 53px;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
        }

        .store-name {
            color: #3075f5;
            font-size: 38px;
            font-weight: bold;
        }

        .form-control {
            height: 64px;
            font-size: 20px;
            border-radius: 10px;
        }

        .form-label {
            font-size: 20px;
            font-weight: bold;
        }

        .create-btn {
            height: 68px;
            font-size: 22px;
            background-color: #3075f5;
            border: none;
            border-radius: 9px;
        }

        .create-btn:hover {
            background-color: #1558d6;
        }

        @media (max-width: 576px) {
            .form-box {
                margin: 15px;
                padding: 25px 20px;
            }

            .store-name {
                font-size: 29px;
            }

            .form-label {
                font-size: 17px;
            }

            .form-control {
                height: 55px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="form-box">

        <div class="text-center mb-4">
            <h1 class="store-name">E-Commerce Store</h1>
            <h2 class="fw-bold mt-4">Create Account</h2>
            <p class="text-secondary fs-5 mt-3">
                Join us and start shopping!
            </p>
        </div>

        <form>

            <div class="mb-4">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control"
                    placeholder="Enter your full name" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control"
                    placeholder="Enter your email" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control"
                    placeholder="Create a password" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control"
                    placeholder="Confirm your password" required>
            </div>

            <div class="form-check mb-4">
                <input type="checkbox" class="form-check-input"
                    id="terms" required>

                <label class="form-check-label fs-5" for="terms">
                    I agree to the Terms and Conditions
                </label>
            </div>

            <button type="submit"
                class="btn btn-primary create-btn w-100">
                Create Account
            </button>

            <p class="text-center mt-4 mb-0 fs-5">
                Already have an account?
                <a href="login.html"
                    class="text-primary fw-bold text-decoration-none">
                    Login
                </a>
            </p>
<p class="text"><a class="text" href="/html/index.html">back to home page.</a></p>
        </form>

    </div>

</body>
</html>
```
